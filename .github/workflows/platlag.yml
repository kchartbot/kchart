name: platlag
on:
  workflow_dispatch:
    inputs:
      minutes:
        type: string
        default: "50"
jobs:
  lag:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python tools/plat_lag.py "${{ inputs.minutes }}"
