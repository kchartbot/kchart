name: chartbot

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: chartbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 + 의존성
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: out
          key: chartbot-state-${{ github.run_id }}
          restore-keys: chartbot-state-

      - name: 가이섬 갱신 대기
        run: sleep 20

      - name: 실행
        env:
          DC_GALLERY_ID: ${{ vars.DC_GALLERY_ID }}
          DC_MINOR: ${{ vars.DC_MINOR }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          DC_HEADTEXT: ${{ vars.DC_HEADTEXT }}
          DC_ID: ${{ secrets.DC_ID }}
          DC_PW: ${{ secrets.DC_PW }}
          DC_ANON_NICK: ${{ vars.DC_ANON_NICK }}
          DC_ANON_PW: ${{ secrets.DC_ANON_PW }}
          DC_STORAGE_STATE: ${{ secrets.DC_STORAGE_STATE }}
        run: python run.py once --config config.actions.toml

      - name: 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: out
          key: chartbot-state-${{ github.run_id }}

      - name: 차트 이미지 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: out/*.png
          retention-days: 1
          if-no-files-found: ignore

      - name: 실패 화면 보관
        if: failure() && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: dc-error
          path: out/dc_error.png
          retention-days: 2
          if-no-files-found: ignore
