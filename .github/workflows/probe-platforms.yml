name: probe-platforms

# 멜론/지니/벅스/플로 공개 차트 페이지에 GitHub 서버에서 접속이 되는지만 확인 (수동 실행 전용, 플랫폼당 요청 1번)
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 플랫폼 접속 확인
        run: |
          python3 - <<'PY'
          import time, urllib.request, urllib.error
          UA = "chartbot/1.0 (+https://github.com/kchartbot/kchart)"
          targets = {
              "멜론 실시간": "https://www.melon.com/chart/index.htm",
              "지니 실시간": "https://www.genie.co.kr/chart/top200",
              "벅스 실시간": "https://music.bugs.co.kr/chart/track/realtime/total",
              "플로 차트": "https://api.music-flo.com/display/v1/browser/chart/1/content?size=10",
          }
          for i, (name, url) in enumerate(targets.items()):
              if i:
                  time.sleep(5)
              print("=" * 50, "\n", name, url)
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "text/html,application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read(3000).decode("utf-8", "replace")
                      print("status", r.status, "| bytes(앞 3000자 기준)", len(body))
                      print("body:", " ".join(body[:200].split()))
              except urllib.error.HTTPError as e:
                  print("status", e.code, "| server:", e.headers.get("server"))
                  print("body:", " ".join(e.read(300).decode("utf-8", "replace").split())[:200])
              except Exception as e:
                  print("error:", e)
          PY
