name: probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml", "tools/probe.py"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe.py probe_out
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe_out
          retention-days: 5
