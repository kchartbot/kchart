name: probe-users
on:
  push:
    paths: [".github/workflows/probe-users.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          def get(u, ref):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Referer": ref, "Accept-Language": "ko-KR,ko;q=0.9"}), timeout=20).read().decode("utf-8", "replace")
          for u, ref in (("https://www.melon.com/chart/index.htm", "https://www.melon.com/"), ("https://m2.melon.com/chart/index.htm", "https://m2.melon.com/")):
              t = get(u, ref)
              print("PAGE", u, len(t))
              for m in list(re.finditer("실시간", t))[:8]:
                  print("  [실시간]", " ".join(t[max(0, m.start()-120):m.end()+120].split()))
              print("  JSON:", sorted(set(re.findall(r"[\w/.:-]*chart[\w/.-]*\.(?:json|htm)", t)))[:40])
          for u in ("https://m2.melon.com/m6/chart/ent/songChartList.json?type=REALTIME", "https://m2.melon.com/m6/chart/ent/realtimeSongChartList.json", "https://m2.melon.com/m6/chart/realtime/songChartList.json", "https://m2.melon.com/m6/chart/ent/songChartRealtime.json"):
              try:
                  t = get(u, "https://m2.melon.com/")
                  print("TRY OK", u, len(t), " ".join(t[:160].split()))
              except Exception as e:
                  print("TRY FAIL", u, str(e)[:60])
          PY
