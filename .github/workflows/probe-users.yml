name: probe-users
on:
  push:
    paths: [".github/workflows/probe-users.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          u = "https://m2.melon.com/m6/chart/ent/songChartList.json"
          t = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Referer": "https://m2.melon.com/"}), timeout=20).read().decode("utf-8", "replace")
          d = json.loads(t)["response"]
          print("KEYS", [k for k in d if k != "SONGLIST"])
          print("META", {k: d[k] for k in d if k != "SONGLIST"})
          for it in d["SONGLIST"][:3]:
              print("ITEM", json.dumps(it, ensure_ascii=False))
          print("N", len(d["SONGLIST"]))
          PY
