name: preview
# 순위표 디자인 후보를 실제 멜론 TOP100과 앨범 커버로 그려 preview 브랜치에 올림 (확인용). 로그도 같이 저장.
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  CP_KEY: ${{ secrets.CP_KEY }}
  CP_KEY_2: ${{ secrets.CP_KEY_2 }}
  CP_BASE: ${{ secrets.CP_BASE }}
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt pillow
          playwright install --with-deps chromium
      - run: |
          mkdir -p /tmp/preview
          python tools/preview_design.py /tmp/preview 2>&1 | tee /tmp/preview/log.txt
      - if: always()
        run: |
          git config user.name preview; git config user.email preview@users.noreply.github.com
          git checkout -q --orphan preview; git rm -rfq . || true; git clean -fdxq
          cp /tmp/preview/* . 2>/dev/null || true
          git add -A; git commit -qm "preview $(date -u +%T)"; git push -qf origin preview
