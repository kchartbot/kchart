name: probe-extra
on:
  push:
    paths: [".github/workflows/probe-extra.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, re, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          t = urllib.request.urlopen(urllib.request.Request("https://www.music-flo.com/api/display/v1/browser/chart/1/track/list?size=100", headers={"User-Agent": UA, "Referer": "https://www.music-flo.com/"}), timeout=20).read().decode()
          d = json.loads(t)["data"]
          tr = d["trackList"]
          print("FLO count", len(tr), "keys", list(d.keys()))
          print("FLO track0", json.dumps(tr[0], ensure_ascii=False)[:1800])
          print("FLO ranks", [(x.get("rank", {}) if isinstance(x.get("rank"), dict) else x.get("rank")) for x in tr[:3]])
          h = urllib.request.urlopen(urllib.request.Request("https://www.melon.com/chart/hot100/index.htm", headers={"User-Agent": UA}), timeout=20).read().decode("utf-8", "replace")
          m = re.search(r'<tr[^>]*class="lst50"[^>]*>', h)
          print("MELON hot100 row tag", m.group(0) if m else None, "rank_up", len(re.findall("rank_up", h)), "span.rank", len(re.findall(r'class="rank"', h)))
          rows = re.findall(r'<tr[^>]*class="lst(?:50|100)"[^>]*data-song-no="(\d+)"', h)
          print("MELON hot100 songs", len(rows), rows[:3])
          PY
