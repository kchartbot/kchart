# GitHub Actions 용 설정. 갤러리ID/마이너 여부/dry_run 은 저장소 Variables 로 덮어씁니다 (README 참고).
[bot]
charts = [
  "melon_top100", "melon_hot100_five", "melon_hot100_graph", "melon_five", "melon_realtime",
  "melon_24h_count", "genie_realtime", "flo_chart", "bugs_realtime",
]
hourly_after_minute = 5
min_request_gap = 3.0
image_budget = 30
image_gap = 1.0
dry_run = true                 # Variables 의 DRY_RUN=false 로 바꾸기 전까지 업로드하지 않습니다
user_agent = "chartbot/1.0"
out_dir = "out"

[dc]
gallery_id = "CHANGE_ME"
minor = true
headtext = "차트봇"
