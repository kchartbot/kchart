# GitHub Actions 용 설정. 갤러리ID/마이너 여부/dry_run 은 저장소 Variables 로 덮어씁니다 (README 참고).
[bot]
charts = [
  # 5분 차트는 점수 데이터가 생기기 전까지 사용 안 함
  # "melon_rank_five",
  # "melonhot_rank_five",
  # 1시간 차트 (정시부터 15분 안에서만)
  # 순위표 업로드 중지 (요청에 따라 주석 처리, 다시 켜려면 아래 주석 해제)
  # "melon_rank",
  # "melonhot_rank",
  # "genie_rank",
  # "bugs_rank",
  # "flo_rank",
  # 그래프는 아직 사용 안 함
  # "melon_rank_graph",
  # "melonhot_rank_graph",
  # "genie_rank_graph",
  # "bugs_rank_graph",
  # "flo_rank_graph",
  # 지니/벅스/플로 5분 차트는 사용 안 함
  # "genie_rank_five",
  # "bugs_rank_five",
  # "flo_rank_five",
]
own_charts = ["own_top100", "own_users", "own_predict"]   # 올리는 멜론 글
hourly_after_minute = 5
hourly_window_minutes = 15  # 1시간 단위 차트는 정시~정시+15분 안에서만 올림 (02:00, 03:00 …)
max_posts = 20              # 한 번 실행에 올리는 글 수 (차례대로 하나씩)
post_gap_seconds = "6"       # 글과 글 사이 간격(초)
upload_workers = 2           # 동시에 올리는 글 수 (시작 시각은 간격을 둠)
rank_style = "classic"        # 순위표 디자인: classic(원래 2단 표) / list1(1열 앨범 큰 목록) / list2(2열 큰 카드)
precise_top = true           # 정각 전에 미리 준비해 두고 정각에 첫 글(TOP100)을 바로 올림
precise_lead_minutes = 16     # 정각 16분 전부터 시작한 실행은 준비 후 정각까지 기다림
min_request_gap = 3.0
image_budget = 100            # 정각 전에 미리 받아 두므로 100곡 전부 앨범 이미지 넣음
image_gap = 0.5
dry_run = true                 # Variables 의 DRY_RUN=false 로 바꾸기 전까지 업로드하지 않습니다
user_agent = "chartbot/1.0"
out_dir = "out"

[dc]
gallery_id = "CHANGE_ME"
minor = true
headtext = "차트"
