# GitHub Actions 용 설정. 갤러리ID/마이너 여부/dry_run 은 저장소 Variables 로 덮어씁니다 (README 참고).
[bot]
charts = [
  "melon_rank",
  # "melonhot_rank",
  # "genie_rank",
  # "bugs_rank",
  # "flo_rank",
  # "melon_rank_graph",
  # "melonhot_rank_graph",
  # "genie_rank_graph",
  # "bugs_rank_graph",
  # "flo_rank_graph",
  # "melon_rank_five",
  # "melonhot_rank_five",
]
hourly_after_minute = 5
hourly_window_minutes = 15  # 1시간 단위 차트는 정시~정시+15분 안에서만 올림 (02:00, 03:00 …)
max_posts = 1               # 한 번 실행에 올리는 글 수
min_request_gap = 3.0
image_budget = 30
image_gap = 1.0
dry_run = true                 # Variables 의 DRY_RUN=false 로 바꾸기 전까지 업로드하지 않습니다
user_agent = "chartbot/1.0"
out_dir = "out"

[dc]
gallery_id = "CHANGE_ME"
minor = true
headtext = "차트봇"
